<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assovel Consórcios - Simulador de Carta de Crédito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Montserrat', sans-serif;
      }
      /* Custom styles for the range slider progress */
      #value-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 12px;
        background: #e6e6e6; /* light gray */
        border-radius: 9999px;
        outline: none;
        opacity: 0.9;
        transition: opacity .2s;
        background-image: linear-gradient(#dad50a, #dad50a); /* new yellow */
        background-repeat: no-repeat;
      }
      #value-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        background: #dad50a; /* new yellow */
        cursor: pointer;
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
      }
      #value-slider::-moz-range-thumb {
        width: 24px;
        height: 24px;
        background: #dad50a; /* new yellow */
        cursor: pointer;
        border-radius: 50%;
        border: none;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
      }
    </style>
